// 빌드: node tools/package.js android  (앱 자산·libnode 준비 → assembleRelease → dist/*.apk)
// 서명: android/keystore.properties (저장소에 넣지 않음)
//   storeFile=/절대/경로/release.jks
//   storePassword=…  keyAlias=…  keyPassword=…
// 없으면 디버그 키로 서명한다 (설치는 되지만 정식 배포용이 아님).
plugins {
    id 'com.android.application'
}

def pkg = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json'))
def (vMajor, vMinor, vPatch) = pkg.version.tokenize('.').collect { it.replaceAll(/\D.*/, '') as int }
def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'com.minaryhub.robotemulator'
    compileSdk 36
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'com.minaryhub.robotemulator'
        minSdk 24
        targetSdk 36
        versionCode vMajor * 10000 + vMinor * 100 + vPatch
        versionName pkg.version
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        externalNativeBuild { ndkBuild { arguments 'APP_PLATFORM=android-24' } }
    }

    signingConfigs {
        release {
            if (ks.getProperty('storeFile')) {
                storeFile file(ks.getProperty('storeFile'))
                storePassword ks.getProperty('storePassword')
                keyAlias ks.getProperty('keyAlias')
                keyPassword ks.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ks.getProperty('storeFile') ? signingConfigs.release : signingConfigs.debug
        }
    }

    externalNativeBuild { ndkBuild { path 'src/main/cpp/Android.mk' } }

    // libnode.so(nodejs-mobile) 는 APK 안에서 압축 (용량 절반 이하). 설치 시 풀림
    packaging { jniLibs { useLegacyPackaging true } }
    // 앱 자산(zip)은 이미 압축되어 있으므로 다시 압축하지 않음
    androidResources { noCompress 'zip' }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
