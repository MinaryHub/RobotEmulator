<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Robot Emulator (small)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232932"/>
      <stop offset="1" stop-color="#111418"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9b3d"/>
      <stop offset="1" stop-color="#e5680a"/>
    </linearGradient>
    <linearGradient id="joint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6f8"/>
      <stop offset="1" stop-color="#b9c0c9"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>
  

  <!-- 시뮬레이션 궤적 (점선) + 목표점 -->
  

  <!-- 바닥판 · 베이스 -->
  <rect x="96" y="410" width="236" height="30" rx="15" fill="#3b424c"/>
  <path d="M150 410 L168 348 H252 L270 410 Z" fill="url(#arm)"/>

  <!-- 상완 (어깨 → 팔꿈치) -->
  <line x1="210" y1="336" x2="292" y2="196" stroke="url(#arm)" stroke-width="76" stroke-linecap="round"/>
  <!-- 전완 (팔꿈치 → 손목) -->
  <line x1="292" y1="196" x2="392" y2="258" stroke="url(#arm)" stroke-width="60" stroke-linecap="round"/>

  <!-- 관절 -->
  <circle cx="210" cy="336" r="30" fill="url(#joint)"/>
  
  <circle cx="292" cy="196" r="25" fill="url(#joint)"/>
  
  <circle cx="392" cy="258" r="19" fill="url(#joint)"/>

  <!-- 그리퍼 -->
  <rect x="372" y="272" width="40" height="18" rx="5" fill="#3b424c"/>
  <rect x="372" y="286" width="11" height="34" rx="4" fill="#d6dbe1"/>
  <rect x="401" y="286" width="11" height="34" rx="4" fill="#d6dbe1"/>

  <!-- 목표점 (TCP) -->
  <circle cx="404" cy="338" r="12" fill="none" stroke="#3d8bfd" stroke-width="6"/>
  <circle cx="404" cy="338" r="4" fill="#3d8bfd"/>
</svg>
