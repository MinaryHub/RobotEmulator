<!doctype html>
<!-- GitHub 소셜 미리보기 이미지 (1280×640). brand/render.sh 가 social-preview.png 로 렌더링 -->
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }

  <img src="logo.svg" alt="">
